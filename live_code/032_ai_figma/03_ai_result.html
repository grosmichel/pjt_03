<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThRead - 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #fff;
    }
    /* Navbar 스타일 */
    .navbar-custom {
      background-color: #f8f9fa;
      border-bottom: 1px solid #e6e6e6;
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
    }
    /* 로그인 카드 스타일링 */
    .login-card {
      width: 100%;
      max-width: 520px;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
      box-shadow: 0 6px 14px rgba(0,0,0,.08);
      background-color: #fff;
    }
    .btn-login {
      background-color: #1db027;
      color: #fff;
      border: 0;
      height: 48px;
      border-radius: 6px;
      font-weight: 600;
    }
    .btn-login:hover {
      background-color: #15a81f;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light fixed-top navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="#">ThRead</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="토글 네비게이션">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="#">쓰레드</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">도서 검색</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">마이 페이지</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">로그아웃</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 로그인 영역 -->
  <main class="container" style="padding-top: 100px;">
    <div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 100px);">
      <div class="login-card p-0">
        <div class="card-body p-4">
          <form>
            <div class="mb-3">
              <label for="email" class="form-label mb-1">이메일</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label mb-1">비밀번호</label>
              <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
            </div>
          </form>
        </div>
        <div class="border-top px-4 py-3">
          <button type="submit" class="btn btn-login w-100">로그인</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
